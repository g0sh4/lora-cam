[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
lib_deps = 
	sandeepmistry/LoRa@^0.8.0
	jgromes/RadioLib@^7.2.1
upload_speed = 115200
monitor_speed = 115200